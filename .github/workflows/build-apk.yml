nname: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Siapkan keystore dan google-services.json
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== KODE SHA1 UNTUK FIREBASE ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:"
          rm -f app/google-services.json
          printf '%s\n' '{"project_info":{"project_number":"583437998565","project_id":"winter-axon-z7cdj","storage_bucket":"winter-axon-z7cdj.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:583437998565:android:a6cff01d68136aa6ac370c","android_client_info":{"package_name":"com.aistudio.cbtnusantara.vkorap"}},"oauth_client":[{"client_id":"://googleusercontent.com","client_type":1,"android_info":{"package_name":"com.aistudio.cbtnusantara.vkorap","certificate_hash":"779f5edbfd811dfea163fd671293a3f373ad7011"}},{"client_id":"://googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDdDKikZ44jA_QSu3OSnU6Qffx5KKd5wTk"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"://googleusercontent.com","client_type":3}]}}}],"configuration_version":"1"}' > app/google-services.json

      - name: Build Debug APK
        run: gradle assembleDebug --no-build-cache --rerun-tasks

      - name: Upload file APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-UTBK-APK
          path: "**/build/outputs/apk/debug/*.apk"
