name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Siapkan debug.keystore dan Firebase ID Asli
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/firebase_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">://googleusercontent.com</string>
          </resources>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload file APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-UTBK-APK
          path: "**/build/outputs/apk/debug/*.apk"
